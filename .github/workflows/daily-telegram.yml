name: Daily Telegram Report

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send daily Telegram report
        env:
          APP_BASE_URL: ${{ secrets.TRIGUARD_APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.TRIGUARD_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$APP_BASE_URL" ]; then
            echo "TRIGUARD_APP_BASE_URL is not configured."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "TRIGUARD_CRON_SECRET is not configured."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            "${APP_BASE_URL%/}/api/notifications/daily")"

          echo "TriGuard daily notification response:"
          echo "$response"